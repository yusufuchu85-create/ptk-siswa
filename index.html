}

/* ------------------ Dinas: Data Semua Sekolah (rekap seluruh sekolah) ------------------ */
async function loadDinasAllData(){
  const jenjang = APP.dinasDataAllJenjang;
  const month = APP.dinasDataAllMonth;
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const out = {};
  schools.forEach(s=>{ out[s.id] = {school:s, status:{status:'draft'}, rows:[]}; });
  if(ids.length>0){
    const {data:statuses} = await sb.from('submission_status').select('*').eq('period', month).in('school_id', ids);
    (statuses||[]).forEach(st=>{ if(out[st.school_id]) out[st.school_id].status = st; });
    const {data:rows} = await sb.from('ptk_records').select('*').eq('period', month).in('school_id', ids).order('created_at');
    (rows||[]).forEach(r=>{ if(out[r.school_id]) out[r.school_id].rows.push({id:r.id, ...r.data}); });
    Object.values(out).forEach(o=>{ o.rows = sortRowsByOrder(o.rows); });
  }
  APP.dinasDataAllRows = out;
}
async function loadDinasAllStudentData(){
  const jenjang = APP.dinasDataAllJenjang;
  const month = APP.dinasDataAllMonth;
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const out = {};
  schools.forEach(s=>{ out[s.id] = {school:s, status:{status:'draft'}, counts:{}, rombel:{}}; });
  if(ids.length>0){
    const {data:statuses} = await sb.from('student_submission_status').select('*').eq('period', month).in('school_id', ids);
    (statuses||[]).forEach(st=>{ if(out[st.school_id]) out[st.school_id].status = st; });
    const {data:counts} = await sb.from('student_counts').select('*').eq('period', month).in('school_id', ids);
    (counts||[]).forEach(c=>{ if(out[c.school_id]) out[c.school_id].counts[c.class_key+'|'+c.religion_key] = {male:c.male, female:c.female}; });
    const {data:rombel} = await sb.from('student_rombel').select('*').eq('period', month).in('school_id', ids);
    (rombel||[]).forEach(r=>{ if(out[r.school_id]) out[r.school_id].rombel[r.class_key] = r.rombel; });
  }
  APP.dinasStuDataAllRows = out;
}
function dinasDataPage(){
  return `
  <div class="pill-row" style="margin-bottom:14px;">
    <button class="pill ${APP.dinasDataAllType==='ptk'?'active':''}" onclick="dinasDataAllSetType('ptk')">Data PTK</button>
    <button class="pill ${APP.dinasDataAllType==='siswa'?'active':''}" onclick="dinasDataAllSetType('siswa')">Data Siswa</button>
  </div>
  ${APP.dinasDataAllType==='siswa' ? dinasDataAllStudentPage() : dinasDataAllPtkPage()}`;
}
async function dinasDataAllSetType(t){
  APP.dinasDataAllType = t;
  if(t==='siswa') await loadDinasAllStudentData(); else await loadDinasAllData();
  render();
}
async function dinasDataAllChangeMonth(v){
  APP.dinasDataAllMonth = v;
  if(APP.dinasDataAllType==='siswa') await loadDinasAllStudentData(); else await loadDinasAllData();
  render();
}
async function dinasDataAllChangeJenjang(j){
  APP.dinasDataAllJenjang = j;
  if(APP.dinasDataAllType==='siswa') await loadDinasAllStudentData(); else await loadDinasAllData();
  render();
}
function dinasDataAllPtkPage(){
  const rows = Object.values(APP.dinasDataAllRows||{});
  return `
  <div class="card">
    <div class="toolbar">
      <input type="month" class="month-input" value="${APP.dinasDataAllMonth}" onchange="dinasDataAllChangeMonth(this.value)">
      <div class="pill-row">
        <button class="pill ${APP.dinasDataAllJenjang==='ALL'?'active':''}" onclick="dinasDataAllChangeJenjang('ALL')">Semua</button>
        ${JENJANGS.map(j=>`<button class="pill ${APP.dinasDataAllJenjang===j?'active':''}" onclick="dinasDataAllChangeJenjang('${j}')">${j}</button>`).join('')}
      </div>
    </div>
    ${rows.length===0 ? '<div class="empty"><div class="big">📋</div>Tidak ada sekolah pada filter ini.</div>' : `
    <div class="table-scroll"><table><thead><tr><th>Jenjang</th><th>Sekolah</th><th>Jumlah PTK</th><th>Status</th><th>Aksi</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr><td>${r.school.jenjang}</td><td>${esc(r.school.name)}</td><td>${r.rows.length}</td>
      <td><span class="badge ${STATUS_BADGE_CLASS[r.status.status]}">${STATUS_LABEL[r.status.status]}</span></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="dinasViewSchoolAll('${r.school.id}')">Lihat</button>
        ${r.rows.length>0 ? `<button class="btn btn-teal btn-sm" onclick="dinasDownloadExcelForSchoolAll('${r.school.id}')">Unduh Excel</button>` : ''}
        ${r.status.status==='terverifikasi' ? `<button class="btn btn-outline btn-sm" onclick="dinasDownloadPdfForSchoolAll('${r.school.id}')">📄 Unduh PDF</button>` : ''}
      </td></tr>`).join('')}</tbody></table></div>`}
  </div>`;
}
function dinasDataAllStudentPage(){
  const rows = Object.values(APP.dinasStuDataAllRows||{});
  return `
  <div class="card">
    <div class="toolbar">
      <input type="month" class="month-input" value="${APP.dinasDataAllMonth}" onchange="dinasDataAllChangeMonth(this.value)">
      <div class="pill-row">
        <button class="pill ${APP.dinasDataAllJenjang==='ALL'?'active':''}" onclick="dinasDataAllChangeJenjang('ALL')">Semua</button>
        ${JENJANGS.map(j=>`<button class="pill ${APP.dinasDataAllJenjang===j?'active':''}" onclick="dinasDataAllChangeJenjang('${j}')">${j}</button>`).join('')}
      </div>
    </div>
    ${rows.length===0 ? '<div class="empty"><div class="big">📋</div>Tidak ada sekolah pada filter ini.</div>' : `
    <div class="table-scroll"><table><thead><tr><th>Jenjang</th><th>Sekolah</th><th>Total Siswa</th><th>Status</th><th>Aksi</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr><td>${r.school.jenjang}</td><td>${esc(r.school.name)}</td><td>${studentTotalStudents(r.counts)}</td>
      <td><span class="badge ${STATUS_BADGE_CLASS[r.status.status]}">${STATUS_LABEL[r.status.status]}</span></td>
      <td>
        <button class="btn btn-outline btn-sm" onclick="dinasViewSchoolStudentAll('${r.school.id}')">Lihat</button>
        <button class="btn btn-teal btn-sm" onclick="dinasDownloadStudentExcelForSchoolAll('${r.school.id}')">Unduh Excel</button>
        ${r.status.status==='terverifikasi' ? `<button class="btn btn-outline btn-sm" onclick="dinasDownloadStudentPdfForSchoolAll('${r.school.id}')">📄 Unduh PDF</button>` : ''}
      </td></tr>`).join('')}</tbody></table></div>`}
  </div>`;
}
function dinasViewSchoolAll(schoolId){ APP.modal = {type:'viewSchoolDinas', schoolId}; render(); }
function dinasViewSchoolStudentAll(schoolId){ APP.modal = {type:'viewSchoolStudentDinas', schoolId}; render(); }
function renderViewSchoolDinasModal(){
  const d = APP.dinasDataAllRows[APP.modal.schoolId];
  if(!d) return '';
  const fields = APP.instruments[d.school.jenjang];
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:960px;">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h3>${esc(d.school.name)} — ${monthLabel(APP.dinasDataAllMonth)}</h3>
      ${renderReadOnlyTable(fields, d.rows, d.school.name, APP.dinasDataAllMonth)}
    </div>
  </div>`;
}
function renderViewSchoolStudentDinasModal(){
  const d = APP.dinasStuDataAllRows[APP.modal.schoolId];
  if(!d) return '';
  const classes = APP.studentClasses[d.school.jenjang]||[];
  const religions = APP.studentReligions[d.school.jenjang]||[];
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:960px;">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h3>${esc(d.school.name)} — Data Siswa ${monthLabel(APP.dinasDataAllMonth)}</h3>
      ${studentMatrixHtml(classes, religions, d.counts, d.rombel, false)}
    </div>
  </div>`;
}
async function dinasDownloadExcelForSchoolAll(schoolId){
  const d = APP.dinasDataAllRows[schoolId];
  if(!d || d.rows.length===0) return;
  const fields = APP.instruments[d.school.jenjang];
  const wb = buildWorkbook(fields, d.rows, d.school.name, APP.dinasDataAllMonth);
  XLSX.writeFile(wb, sanitizeFileName(d.school.name)+'-'+APP.dinasDataAllMonth+'.xlsx');
}
async function dinasDownloadStudentExcelForSchoolAll(schoolId){
  const d = APP.dinasStuDataAllRows[schoolId];
  if(!d) return;
  const classes = APP.studentClasses[d.school.jenjang]||[];
  const religions = APP.studentReligions[d.school.jenjang]||[];
  const wb = buildStudentWorkbook(classes, religions, d.counts, d.rombel, d.school.name);
  XLSX.writeFile(wb, 'Siswa-'+sanitizeFileName(d.school.name)+'-'+APP.dinasDataAllMonth+'.xlsx');
}
function dinasDownloadPdfForSchoolAll(schoolId){
  const d = APP.dinasDataAllRows[schoolId];
  if(!d || d.status.status!=='terverifikasi') return;
  const fields = APP.instruments[d.school.jenjang]||[];
  generatePtkPdf(d.school, fields, d.rows, APP.dinasDataAllMonth, d.status);
}
function dinasDownloadStudentPdfForSchoolAll(schoolId){
  const d = APP.dinasStuDataAllRows[schoolId];
  if(!d || d.status.status!=='terverifikasi') return;
  const classes = APP.studentClasses[d.school.jenjang]||[];
  const religions = APP.studentReligions[d.school.jenjang]||[];
  generateStudentPdf(d.school, classes, religions, d.counts, d.rombel, APP.dinasDataAllMonth, d.status);
}

/* --------------------------------- init ---------------------------------- */
boot();
</script>
</body>
