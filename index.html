<style>

  }

  body{background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}

<div id="app"><div class="loading-screen">Memuat Portal Data PTK…</div></div>

<script>
/* =========================================================================
   PORTAL DATA PTK — versi backend sungguhan (Supabase: Postgres + Auth)
   ISI DUA NILAI DI BAWAH INI dengan milik proyek Supabase Anda sendiri
   (Project Settings > API di dashboard Supabase). Lihat PANDUAN-DEPLOY.md
   ========================================================================= */
const SUPABASE_URL = 'https://ujbyvjdaqqqneiviiozd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KbpuNSX6xcIMgICpmfNx-Q_vAy9oemT';

const NOT_CONFIGURED = SUPABASE_URL.startsWith('GANTI_') || SUPABASE_ANON_KEY.startsWith('GANTI_');
const sb = NOT_CONFIGURED ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const JENJANGS = ['TK','SD','SMP'];
const STATUS_LABEL = { draft:'Belum Diajukan', diajukan:'Menunggu Verifikasi', terverifikasi:'Terverifikasi', revisi:'Perlu Perbaikan', pembatalan:'Menunggu Persetujuan Pembatalan' };
const STATUS_BADGE_CLASS = { draft:'badge-draft', diajukan:'badge-diajukan', terverifikasi:'badge-terverifikasi', revisi:'badge-revisi', pembatalan:'badge-pembatalan' };

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isPdfDataUrl(v){ return typeof v==='string' && v.indexOf('data:application/pdf')===0; }
function renderPhotoCell(v){
  if(!v) return '-';
  if(isPdfDataUrl(v)) return `<a href="${v}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">📄 Lihat PDF</a>`;
  return `<img class="photo-thumb" src="${v}">`;
}
function formatRupiah(v){
  if(v===undefined || v===null || v==='') return '-';
  const n = Number(v);
  if(isNaN(n)) return esc(v);
  return 'Rp' + n.toLocaleString('id-ID');
}
function cellValue(f, r, period){
  if(f.type==='photo') return renderPhotoCell(r[f.key]);
  if(f.type==='tenure'){ const refKey=(f.options||[])[0]; return esc(computeMasaKerja(r[refKey], period) || '-'); }
  if(f.type==='currency') return formatRupiah(r[f.key]);
  return esc(r[f.key]);
}
function ptkRowIsEmpty(fields, row){
  return (fields||[]).every(f=>{
    if(f.type==='tenure') return true;
    const v = row[f.key];
    return v===undefined || v===null || String(v).trim()==='';
  });
}
function currentMonthStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(ym){
  if(!ym) return '-';
  const [y,m]=ym.split('-');
  const names=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return names[parseInt(m,10)-1] + ' ' + y;
}
function nowIso(){ return new Date().toISOString(); }
// Parser tanggal yang toleran terhadap berbagai format input (ISO, DD/MM/YYYY ala Indonesia/Excel,
// serial number Excel, maupun objek Date). Selalu mengembalikan string ISO "YYYY-MM-DD" atau '' jika gagal.
// Ini memperbaiki bug lama: new Date("15/06/2010") gagal diparse browser karena "15" dibaca sebagai
// bulan (format Amerika MM/DD/YYYY) padahal yang dimaksud adalah tanggal 15 -> jadi kalau tanggal >12
// selalu invalid, sementara tanggal <=12 "kebetulan" masih terbaca (meski salah tafsir bulan/tanggal).
function parseFlexibleDate(val){
  if(val===undefined || val===null || val==='') return '';
  if(val instanceof Date){
    if(isNaN(val.getTime())) return '';
    return val.getFullYear()+'-'+String(val.getMonth()+1).padStart(2,'0')+'-'+String(val.getDate()).padStart(2,'0');
  }
  if(typeof val === 'number'){
    if(window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){
      const p = XLSX.SSF.parse_date_code(val);
      if(p) return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0');
    }
    return '';
  }
  const s = String(val).trim();
  if(!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){
    let dd = parseInt(m[1],10), mm = parseInt(m[2],10), yyyy = parseInt(m[3],10);
    if(dd>12 && mm<=12){ /* format DD/MM/YYYY, sudah benar */ }
    else if(mm>12 && dd<=12){ const t=dd; dd=mm; mm=t; } // ketuker, posisi bulan>12 -> tukar jadi DD/MM
    if(dd<1||dd>31||mm<1||mm>12) return '';
    return yyyy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
  }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return '';
}
// Menghitung masa kerja (tahun & bulan) dari sebuah tanggal (mis. Tanggal Pengangkatan/TMT)
// dihitung sampai akhir periode bulan laporan yang sedang aktif (atau hari ini bila periode kosong).
function computeMasaKerja(tmtStr, periodYm){
  if(!tmtStr) return '';
  const iso = parseFlexibleDate(tmtStr);
  if(!iso) return '';
  const [ty,tm,td] = iso.split('-').map(Number);
  const tmt = new Date(ty, tm-1, td);
  if(isNaN(tmt.getTime())) return '';
  let asOf;
  if(periodYm){ const [y,m]=periodYm.split('-').map(Number); asOf = new Date(y, m, 0); } // akhir bulan periode
  else asOf = new Date();
  if(asOf < tmt) return '0 tahun 0 bulan';
  let years = asOf.getFullYear() - tmt.getFullYear();
  let months = asOf.getMonth() - tmt.getMonth();
  if(asOf.getDate() < tmt.getDate()) months -= 1;
  if(months < 0){ months += 12; years -= 1; }
  if(years < 0) years = 0;
  return years+' tahun '+months+' bulan';
}
function fmtDateTime(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
// Username -> alamat email semu, agar pengguna cukup mengingat "username",
// sementara Supabase Auth tetap bekerja dengan kredensial yang benar-benar aman.
function toEmail(username){ return username.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@ptk.local'; }

/* ------------------------------- app state -------------------------------- */
const APP = {
  user: null, authView:'login', registerRole:'operator', authMsg:null, page:'dashboard',
  instruments: {TK:[],SD:[],SMP:[]},
  studentClasses: {TK:[],SD:[],SMP:[]}, studentReligions: {TK:[],SD:[],SMP:[]},
  approvedPengawasList: [],
  mySchoolObj: null,
  myBinaanSchools: [],
  pgPendingUsers: [], pgPendingCancellations: [],
  allSchools: [],
  allUsers: [],
  opMonth: currentMonthStr(), opRows: [], opStatus: null, opDataType:'ptk', editingPtkRowId: null,
  opStuCounts: {}, opStuRombel: {}, opStuStatus: null,
  pgSchoolId: null, pgMonth: currentMonthStr(), pgRows: [], pgStatus: null, pgDataType:'ptk',
  pgAllJenjang:'ALL', pgAllMonth: currentMonthStr(), pgAllDataRows: {}, pgAllDataType:'ptk', pgAllStuDataRows: {},
  pgStuCounts: {}, pgStuRombel: {}, pgStuStatus: null,
  adminInstrumentJenjang:'TK', adminStudentInstrumentJenjang:'TK',
  adminDataJenjang:'ALL', adminDataMonth: currentMonthStr(), adminDataRows:{}, adminDataType:'ptk', adminPendingCancellations: [],
  adminStuDataRows:{},
  exportMonth: currentMonthStr(), exportJenjang:'ALL', exportSelectedKeys: null, exportDataType:'ptk', exportOnlySubmitted: true,
  dinasJenjang:'ALL', dinasMonth: currentMonthStr(), dinasSchoolId:'ALL', dinasSelectedKeys: null, dinasDataType:'ptk',
  dinasDataAllType:'ptk', dinasDataAllMonth: currentMonthStr(), dinasDataAllJenjang:'ALL', dinasDataAllRows:{}, dinasStuDataAllRows:{},
  announcements: [],
  modal: null,
  schoolSearchQuery: '',
  pageLoading: false,
  _loadedPages: new Set()
};

function render(){ mount(renderRoot()); }
function mount(html){
  // Simpan posisi scroll halaman & posisi geser tiap tabel (.table-scroll) sebelum diganti,
  // supaya saat sedang mengedit/mengubah urutan data (yang memicu render ulang seluruh halaman),
  // tampilan TIDAK melompat balik ke atas atau ke kiri — posisi tetap seperti semula.
  const scrollY = window.scrollY;
  const tableScrollPositions = Array.from(document.querySelectorAll('.table-scroll')).map(el=>el.scrollLeft);
  document.getElementById('app').innerHTML = html + (NOT_CONFIGURED ? '<div class="setup-warning">⚠️ Portal belum terhubung ke Supabase. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas berkas HTML ini (lihat PANDUAN-DEPLOY.md).</div>' : '');
  window.scrollTo(0, scrollY);
  document.querySelectorAll('.table-scroll').forEach((el,i)=>{ if(tableScrollPositions[i]!==undefined) el.scrollLeft = tableScrollPositions[i]; });
}

/* ------------------------------- bootstrap -------------------------------- */
async function boot(){
  if(NOT_CONFIGURED){ render(); return; }
  await loadInstruments();
  await loadStudentInstruments();
  await loadApprovedPengawasList();
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    const profile = await fetchMyProfile();
    if(profile && profile.status==='approved'){
      APP.user = profile;
      render();
      await afterLoginLoad();
      return;
    } else {
      await sb.auth.signOut();
    }
  }
  render();
}

async function loadStudentInstruments(){
  const {data:classes} = await sb.from('student_classes').select('*').order('sort_order');
  const {data:religions} = await sb.from('student_religions').select('*').order('sort_order');
  APP.studentClasses = {TK:[],SD:[],SMP:[]};
  APP.studentReligions = {TK:[],SD:[],SMP:[]};
  (classes||[]).forEach(c=>{ APP.studentClasses[c.jenjang].push({_id:c.id, key:c.key, label:c.label}); });
  (religions||[]).forEach(r=>{ APP.studentReligions[r.jenjang].push({_id:r.id, key:r.key, label:r.label}); });
}

async function loadInstruments(){
  const {data} = await sb.from('instrument_fields').select('*').order('sort_order');
  APP.instruments = {TK:[],SD:[],SMP:[]};
  (data||[]).forEach(f=>{ APP.instruments[f.jenjang].push({_id:f.id, key:f.key, label:f.label, type:f.type, options:f.options}); });
}
async function loadApprovedPengawasList(){
  const {data} = await sb.rpc('list_approved_pengawas');
  APP.approvedPengawasList = data || [];
}
async function fetchMyProfile(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return null;
  const {data} = await sb.from('profiles').select('*').eq('id', user.id).single();
  return data;
}
async function afterLoginLoad(){
  if(APP.user.role==='operator' || APP.user.role==='kepala_sekolah'){
    await loadMySchool();
    if(APP.mySchoolObj){ await loadOperatorMonth(APP.opMonth); await loadOperatorStudentMonth(APP.opMonth); }
  }
  if(APP.user.role==='admin'){
    await loadAllSchools();
    await loadAllUsersForAdmin();
    await loadAdminPendingCancellations();
  }
  if(APP.user.role==='pengawas'){
    await loadMyBinaan();
    await loadPengawasPendingUsers();
    await loadPengawasPendingCancellations();
    if(APP.myBinaanSchools.length){ APP.pgSchoolId = APP.myBinaanSchools[0].id; await loadPengawasMonth(); await loadPengawasStudentMonth(); }
  }
  if(APP.user.role==='dinas'){
    await loadAllSchools();
  }
  APP._loadedPages.add('dashboard');
  if(APP.user.role==='operator' || APP.user.role==='kepala_sekolah'){ APP._loadedPages.add('dataPTK'); }
  render();
}
async function loadMySchool(){
  if(APP.user.role==='kepala_sekolah'){
    if(!APP.user.school_id){ APP.mySchoolObj = null; return; }
    const {data} = await sb.from('schools').select('*').eq('id', APP.user.school_id).maybeSingle();
    APP.mySchoolObj = data || null;
    return;
  }
  const {data} = await sb.from('schools').select('*').eq('operator_id', APP.user.id).maybeSingle();
  APP.mySchoolObj = data || null;
}
async function loadAllSchools(){
  const {data} = await sb.from('schools').select('*').order('jenjang');
  APP.allSchools = data || [];
}
async function loadAllUsersForAdmin(){
  const {data} = await sb.from('profiles').select('*');
  APP.allUsers = data || [];
}
async function loadMyBinaan(){
  const {data} = await sb.from('schools').select('*').eq('pengawas_id', APP.user.id);
  APP.myBinaanSchools = data || [];
}
async function loadPengawasPendingUsers(){
  const ids = APP.myBinaanSchools.map(s=>s.id);
  if(ids.length===0){ APP.pgPendingUsers = []; return; }
  const {data} = await sb.from('profiles').select('*').in('school_id', ids).in('role',['operator','kepala_sekolah']).eq('status','pending');
  APP.pgPendingUsers = data || [];
}
async function loadPengawasPendingCancellations(){
  const ids = APP.myBinaanSchools.map(s=>s.id);
  if(ids.length===0){ APP.pgPendingCancellations = []; return; }
  const {data, error} = await sb.from('submission_status').select('*').in('school_id', ids).eq('status','pembatalan');
  if(error) console.error('loadPengawasPendingCancellations error:', error.message);
  APP.pgPendingCancellations = (data||[]).map(st=>({...st, school: APP.myBinaanSchools.find(s=>s.id===st.school_id)}));
}
async function loadAdminPendingCancellations(){
  const {data, error} = await sb.from('submission_status').select('*').eq('status','pembatalan');
  if(error) console.error('loadAdminPendingCancellations error:', error.message);
  APP.adminPendingCancellations = (data||[]).map(st=>({...st, school: APP.allSchools.find(s=>s.id===st.school_id)}));
}

/* =========================================================================
   AUTH
   ========================================================================= */
function goAuthView(v){ APP.authView=v; APP.authMsg=null; render(); }
function setRegisterRole(r){ APP.registerRole=r; APP.authMsg=null; render(); }

async function doLogin(e){
  e.preventDefault();
  const username = document.getElementById('li-username').value.trim();
  const password = document.getElementById('li-password').value;
  const {error} = await sb.auth.signInWithPassword({email: toEmail(username), password});
  if(error){ APP.authMsg={type:'error', text:'Username atau kata sandi salah.'}; render(); return; }
  const profile = await fetchMyProfile();
  if(!profile){ APP.authMsg={type:'error', text:'Profil pengguna tidak ditemukan. Hubungi Admin.'}; await sb.auth.signOut(); render(); return; }
  if(profile.status !== 'approved'){
    let text = 'Akun Anda belum dapat digunakan untuk masuk.';
    if(profile.status==='pending') text = 'Akun Pengawas Anda masih menunggu persetujuan Admin.';
    if(profile.status==='rejected') text = 'Pendaftaran Anda ditolak oleh Admin.';
    if(profile.status==='nonaktif') text = 'Akun Anda telah dinonaktifkan oleh Admin. Hubungi Admin jika ini keliru.';
    APP.authMsg={type:'error', text};
    await sb.auth.signOut(); render(); return;
  }
  APP.user = profile; APP.page='dashboard'; APP.authMsg=null;
  render();
  await afterLoginLoad();
}

async function logout(){
  await sb.auth.signOut();
  APP.user=null; APP.authView='login'; APP.mySchoolObj=null; APP.myBinaanSchools=[]; APP.allSchools=[]; APP.allUsers=[];
  APP._loadedPages = new Set();
  render();
}

async function doRegister(e){
  e.preventDefault();
  const role = APP.registerRole;
  const name = document.getElementById('rg-name').value.trim();
  const username = document.getElementById('rg-username').value.trim();
  const password = document.getElementById('rg-password').value;
  if(!name || !username || !password){ APP.authMsg={type:'error', text:'Lengkapi semua kolom wajib.'}; render(); return; }
  const email = toEmail(username);
  const meta = {name, role};
  let schoolName, npsn, jenjang, pengawasId, ksSchool;
  if(role==='operator'){
    jenjang = document.getElementById('rg-jenjang').value;
    schoolName = document.getElementById('rg-sekolah').value.trim();
    npsn = document.getElementById('rg-npsn').value.trim();
    pengawasId = document.getElementById('rg-pengawas').value || null;
    if(!schoolName){ APP.authMsg={type:'error', text:'Nama sekolah wajib diisi.'}; render(); return; }
    if(!npsn){ APP.authMsg={type:'error', text:'NPSN wajib diisi.'}; render(); return; }
    {
      const {data:existingSchool} = await sb.from('schools').select('id, name').eq('npsn', npsn).maybeSingle();
      if(existingSchool){
        APP.authMsg={type:'error', text:'NPSN ini sudah terdaftar oleh Operator lain ("'+existingSchool.name+'"). Cukup satu Operator per sekolah, silakan hubungi Admin jika ini keliru.'};
        render(); return;
      }
    }
  } else if(role==='kepala_sekolah'){
    npsn = document.getElementById('rg-npsn-ks').value.trim();
    if(!npsn){ APP.authMsg={type:'error', text:'NPSN sekolah wajib diisi.'}; render(); return; }
    meta.npsn = npsn;
  } else if(role==='pengawas'){
    meta.wilayah = document.getElementById('rg-wilayah').value.trim();
  } else if(role==='dinas'){
    meta.instansi = document.getElementById('rg-instansi').value.trim();
  }

  const {data, error} = await sb.auth.signUp({email, password, options:{data: meta}});
  if(error){
    APP.authMsg={type:'error', text: error.message.includes('already') ? 'Username sudah digunakan, pilih username lain.' : 'Registrasi gagal: '+error.message};
    render(); return;
  }
  const user = data.user;
  if(!user){ APP.authMsg={type:'error', text:'Registrasi gagal, coba lagi.'}; render(); return; }

  if(role==='operator'){
    if(!data.session){
      APP.authMsg={type:'error', text:'Akun dibuat, namun sesi belum aktif (konfirmasi email masih diwajibkan di pengaturan Supabase). Nonaktifkan "Confirm email" di Auth Settings, lalu daftar ulang.'};
      render(); return;
    }
    const {data:school, error:schoolErr} = await sb.from('schools').insert({name:schoolName, npsn, jenjang, operator_id:user.id, pengawas_id:pengawasId}).select().single();
    if(!schoolErr && school){
      await sb.from('profiles').update({school_id:school.id}).eq('id', user.id);
    }
  } else if(role==='kepala_sekolah'){
    if(!data.session){
      APP.authMsg={type:'error', text:'Akun dibuat, namun sesi belum aktif (konfirmasi email masih diwajibkan di pengaturan Supabase), sehingga sekolah BELUM tertaut ke akun ini. Nonaktifkan "Confirm email" di Auth Settings lalu daftar ulang, ATAU minta Admin menautkan sekolahnya secara manual lewat menu Sekolah & Penugasan Pengawas → kolom Kepala Sekolah, setelah akun ini disetujui.'};
      render(); return;
    }
    const {data:foundSchool, error:findErr} = await sb.from('schools').select('*').eq('npsn', npsn).maybeSingle();
    if(findErr || !foundSchool){
      await sb.auth.signOut();
      APP.authMsg={type:'error', text:'NPSN tidak ditemukan. Pastikan Operator sekolah Anda sudah mendaftar terlebih dahulu dan NPSN yang dimasukkan sudah benar. Anda bisa mendaftar ulang dengan NPSN yang benar.'};
      APP.authView='register'; APP.registerRole='kepala_sekolah';
      render(); return;
    }
    ksSchool = foundSchool;
    await sb.from('profiles').update({school_id: ksSchool.id}).eq('id', user.id);
  }
  await sb.auth.signOut();
  APP.authMsg={type:'ok', text: 'Pendaftaran terkirim. Akun Anda menunggu persetujuan Admin sebelum bisa digunakan untuk masuk.'};
  APP.authView='login';
  await loadApprovedPengawasList();
  render();
}

/* =========================================================================
   SHELL
   ========================================================================= */
function navItemsFor(role){
  if(role==='admin') return [['dashboard','Ringkasan'],['persetujuan','Persetujuan Pendaftaran'],['pengguna','Kelola Pengguna &amp; Admin'],['sekolah','Sekolah &amp; Pengawas'],['instrumen','Kelola Instrumen PTK'],['instrumenSiswa','Kelola Instrumen Siswa'],['dataSekolah','Data Semua Sekolah'],['ekspor','Pusat Ekspor Data'],['info','Ruang Info']];
  if(role==='operator' || role==='kepala_sekolah') return [['dashboard','Ringkasan'],['dataPTK','Input Data Bulan Ini'],['riwayat','Riwayat Bulanan'],['info','Ruang Info']];
  if(role==='pengawas') return [['dashboard','Sekolah Binaan'],['persetujuan','Persetujuan Pendaftaran'],['verifikasi','Verifikasi Data'],['dataBinaan','Data Sekolah Binaan'],['info','Ruang Info']];
  if(role==='dinas') return [['dashboard','Ringkasan'],['dataSekolah','Data Semua Sekolah'],['jelajah','Jelajahi Data'],['info','Ruang Info']];
  return [];
}
function roleLabel(r){ return {admin:'Admin', operator:'Operator Sekolah', kepala_sekolah:'Kepala Sekolah', pengawas:'Pengawas', dinas:'Dinas Pendidikan'}[r] || r; }

function renderShell(){
  const items = navItemsFor(APP.user.role);
  const nav = items.map(([key,label])=>`<button class="nav-item ${APP.page===key?'active':''}" onclick="goPage('${key}')"><span class="nav-dot"></span>${label}</button>`).join('');
  return `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="eyebrow">Portal Data</div><h1>PTK · TK/SD/SMP</h1></div>
      <nav>${nav}</nav>
      <div class="user-box">
        <div class="name">${esc(APP.user.name)}</div>
        <div class="role">${roleLabel(APP.user.role)}</div>
        <button class="btn btn-outline btn-sm" onclick="logout()">Keluar</button>
      </div>
    </aside>
    <div class="main">${renderTopbar()}<div class="content">${renderPage()}</div></div>
  </div>
  ${APP.modal ? renderModal() : ''}`;
}

function pageTitle(){
  const map = { dashboard: APP.user.role==='pengawas' ? 'Sekolah Binaan' : 'Ringkasan', persetujuan: APP.user.role==='pengawas' ? 'Persetujuan Pendaftaran Sekolah Binaan' : 'Persetujuan Pendaftaran (Operator & Kepala Sekolah)', pengguna:'Kelola Pengguna & Admin', sekolah:'Sekolah & Penugasan Pengawas', instrumen:'Kelola Instrumen Data PTK', instrumenSiswa:'Kelola Instrumen Data Siswa', dataSekolah:'Data Semua Sekolah', ekspor:'Pusat Ekspor Data', dataPTK:'Input Data Bulan Ini', riwayat:'Riwayat Bulanan', verifikasi:'Verifikasi Data Sekolah Binaan', dataBinaan:'Data Semua Sekolah Binaan', jelajah:'Jelajahi Data', info:'Ruang Info' };
  return map[APP.page] || 'Portal Data PTK';
}
function pageSub(){
  const map = { admin:'Kelola instrumen, persetujuan, dan ekspor data seluruh jenjang.', operator:'Lengkapi dan ajukan data PTK sekolah Anda setiap bulan.', kepala_sekolah:'Kelola bersama Operator data PTK sekolah Anda setiap bulan.', pengawas:'Pantau dan verifikasi data PTK sekolah binaan Anda.', dinas:'Tinjau dan unduh data PTK dari seluruh sekolah.' };
  return map[APP.user.role] || '';
}
function renderTopbar(){
  const hasLoader = !!pageLoader(APP.page);
  return `<div class="topbar"><div><h2>${pageTitle()}</h2><div class="sub">${pageSub()}</div></div>
  <button class="btn btn-outline btn-sm" title="${hasLoader?'Ambil data terbaru dari server untuk halaman ini':'Halaman ini tidak memuat data dari server'}" ${(APP.pageLoading||!hasLoader)?'disabled':''} onclick="refreshCurrentPage()">🔄 Segarkan</button>
  </div>`;
}

// Mengembalikan Promise loader data untuk halaman `p` sesuai role yang aktif, atau null bila halaman
// tidak butuh pemuatan data dari server (murni tampilan/state lokal).
function pageLoader(p){
  const role = APP.user.role;
  if(p==='dataPTK' && (role==='operator' || role==='kepala_sekolah')) return Promise.all([loadOperatorMonth(APP.opMonth), loadOperatorStudentMonth(APP.opMonth)]);
  if(p==='riwayat' && (role==='operator' || role==='kepala_sekolah')) return loadOperatorHistory();
  if(p==='verifikasi' && role==='pengawas') return Promise.all([loadPengawasMonth(), loadPengawasStudentMonth()]);
  if(p==='persetujuan' && role==='pengawas') return loadPengawasPendingUsers();
  if(p==='dashboard' && role==='pengawas') return Promise.all([loadMyBinaan(), loadPengawasPendingUsers(), loadPengawasPendingCancellations()]);
  if(p==='dataBinaan' && role==='pengawas') return (APP.pgAllDataType==='siswa' ? loadPengawasAllStudentData() : loadPengawasAllData());
  if(p==='dashboard' && role==='admin') return Promise.all([loadAllSchools(), loadAllUsersForAdmin(), loadAdminPendingCancellations()]);
  if(p==='persetujuan' && role==='admin') return loadAllUsersForAdmin();
  if(p==='pengguna' && role==='admin') return loadAllUsersForAdmin();
  if(p==='sekolah' && role==='admin') return Promise.all([loadAllSchools(), loadAllUsersForAdmin()]);
  if(p==='dataSekolah' && role==='admin') return (APP.adminDataType==='siswa' ? loadAdminStudentData() : loadAdminData());
  if(p==='dashboard' && role==='dinas') return loadAllSchools();
  if(p==='jelajah' && role==='dinas') return loadAllSchools();
  if(p==='dataSekolah' && role==='dinas') return (APP.dinasDataAllType==='siswa' ? loadDinasAllStudentData() : loadDinasAllData());
  if(p==='info') return loadAnnouncements();
  return null;
}
function goPage(p){
  APP.page=p; APP.modal=null; APP.editingPtkRowId=null;
  const loader = pageLoader(p);
  if(!loader){ render(); return; }
  // Kalau halaman ini sudah pernah dibuka sebelumnya di sesi ini, langsung tampilkan data yang sudah
  // ada di memori (instan, tanpa spinner) — tidak perlu ambil ulang dari server tiap kali pindah menu.
  // Data tetap bisa diperbarui manual lewat tombol "🔄 Segarkan" di pojok kanan atas.
  if(APP._loadedPages.has(p)){ render(); return; }
  APP.pageLoading = true; render();
  loader.then(()=>{ APP._loadedPages.add(p); APP.pageLoading=false; render(); });
}
async function refreshCurrentPage(){
  const loader = pageLoader(APP.page);
  if(!loader){ return; }
  APP.pageLoading = true; render();
  await loader;
  APP._loadedPages.add(APP.page);
  APP.pageLoading = false;
  render();
}

function renderPage(){
  if(APP.pageLoading){
    return `<div class="page-spinner-wrap"><div class="page-spinner"></div><p class="small-muted" style="margin-top:12px;">Memuat data…</p></div>`;
  }
  if(APP.page==='info') return infoPage();
  const r = APP.user.role;
  if(r==='admin'){
    if(APP.page==='dashboard') return adminDashboard();
    if(APP.page==='persetujuan') return adminApprovalPage();
    if(APP.page==='pengguna') return adminUsersPage();
    if(APP.page==='sekolah') return adminSchoolsPage();
    if(APP.page==='instrumen') return adminInstrumentPage();
    if(APP.page==='instrumenSiswa') return adminStudentInstrumentPage();
    if(APP.page==='dataSekolah') return adminDataPage();
    if(APP.page==='ekspor') return adminExportPage();
  }
  if(r==='operator' || r==='kepala_sekolah'){
    if(APP.page==='dashboard') return operatorDashboard();
    if(APP.page==='dataPTK') return operatorDataPage();
    if(APP.page==='riwayat') return operatorHistoryPage();
  }
  if(r==='pengawas'){
    if(APP.page==='dashboard') return pengawasSchoolsPage();
    if(APP.page==='persetujuan') return pengawasApprovalPage();
    if(APP.page==='verifikasi') return pengawasVerifyPage();
    if(APP.page==='dataBinaan') return pengawasAllDataPage();
  }
  if(r==='dinas'){
    if(APP.page==='dashboard') return dinasDashboard();
    if(APP.page==='dataSekolah') return dinasDataPage();
    if(APP.page==='jelajah') return dinasExplorePage();
  }
  return '<div class="empty">Halaman tidak ditemukan.</div>';
}

        : `<button class="btn btn-outline btn-sm" onclick="adminToggleStatus('${u.id}','nonaktif')">Nonaktifkan</button>`}

async function adminChangeRole(userId, newRole){
  if(newRole==='admin'){
    await sb.from('profiles').update({role:'admin', status:'approved'}).eq('id', userId);
  } else if(newRole==='kepala_sekolah'){
    // Perbaikan bug: role Kepala Sekolah WAJIB disertai school_id, kalau tidak akun ini
    // tidak akan pernah muncul sebagai Kepala Sekolah di tabel Sekolah manapun.
    const npsn = prompt('Masukkan NPSN sekolah untuk akun Kepala Sekolah ini:');
    if(npsn===null){ render(); return; }
    const trimmed = npsn.trim();
    if(!trimmed){ alert('NPSN wajib diisi. Perubahan peran dibatalkan.'); render(); return; }
    const {data:foundSchool} = await sb.from('schools').select('*').eq('npsn', trimmed).maybeSingle();
    if(!foundSchool){ alert('NPSN tidak ditemukan. Periksa kembali NPSN sekolah yang dituju. Perubahan peran dibatalkan.'); render(); return; }
    await sb.from('profiles').update({role:newRole, school_id: foundSchool.id}).eq('id', userId);
  } else {
    await sb.from('profiles').update({role:newRole}).eq('id', userId);
  }
  await loadAllUsersForAdmin();
  render();
}
async function adminToggleStatus(userId, status){
  await sb.from('profiles').update({status}).eq('id', userId);
  await loadAllUsersForAdmin();
  render();
}
async function adminDeleteUser(userId, userName){
  if(!confirm('Menghapus akun "'+userName+'" akan menghapus datanya secara permanen dari sistem. Akun ini hanya bisa dihapus karena statusnya sudah Nonaktif. Lanjutkan?')) return;
  const {data, error} = await sb.from('profiles').delete().eq('id', userId).select();
  if(error){
    alert('Gagal menghapus akun: '+error.message);
    return;
  }
  if(!data || data.length===0){
    alert('Akun tidak terhapus. Kemungkinan besar aturan keamanan (RLS) di Supabase belum mengizinkan aksi DELETE pada tabel profiles untuk role Admin. Silakan periksa policy RLS tabel "profiles" di dashboard Supabase.');
    return;
  }
  await loadAllUsersForAdmin();
  render();
}
async function adminRevokeAdmin(userId){
  const admins = APP.allUsers.filter(u=>u.role==='admin');
  if(admins.length<=1){ alert('Tidak dapat mencabut akses Admin terakhir. Tambahkan Admin lain terlebih dahulu.'); return; }
  const isSelf = userId === APP.user.id;
  if(isSelf && !confirm('Anda akan mencabut akses Admin dari akun Anda sendiri dan langsung keluar. Lanjutkan?')) return;
  await sb.from('profiles').update({role:'dinas'}).eq('id', userId);
  if(isSelf){ await logout(); return; }
  await loadAllUsersForAdmin();
  render();
}

function openNewAccountModal(defaultRole){

function renderNewAccountModal(){
  const m = APP.modal;
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>

      ${m.error ? `<div class="msg msg-error">${esc(m.error)}</div>` : ''}
      <div class="field"><label>Peran</label>
        <select id="na-role" onchange="APP.modal.role=this.value; render();">
          ${['admin','operator','kepala_sekolah','pengawas','dinas'].map(r=>`<option value="${r}" ${m.role===r?'selected':''}>${roleTag(r)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Nama Lengkap</label><input id="na-name"></div>
      <div class="field"><label>Username</label><input id="na-username"></div>
      <div class="field"><label>Kata Sandi</label><input id="na-password" type="password" minlength="6"></div>
      ${m.role==='kepala_sekolah' ? `<div class="field"><label>NPSN Sekolah <span class="hint">(wajib)</span></label><input id="na-npsn" placeholder="cth. 12345678">
        <div class="hint" style="margin-top:4px;">Akun akan dihubungkan ke sekolah dengan NPSN ini.</div></div>` : ''}
      <p class="small-muted">Akun yang dibuat lewat sini langsung aktif tanpa perlu persetujuan, apa pun perannya.</p>
      <button class="btn btn-primary btn-block" onclick="saveNewAccountModal()">Buat Akun</button>
    </div>
  </div>`;
}
async function saveNewAccountModal(){
  const role = document.getElementById('na-role').value;
  const name = document.getElementById('na-name').value.trim();
  const username = document.getElementById('na-username').value.trim();
  const password = document.getElementById('na-password').value;
  if(!name || !username || !password || password.length<6){
    APP.modal.error = 'Lengkapi nama, username, dan kata sandi (minimal 6 karakter).';
    render(); return;
  }
  let ksSchool = null;
  if(role==='kepala_sekolah'){
    const npsn = document.getElementById('na-npsn').value.trim();
    if(!npsn){ APP.modal.error = 'NPSN sekolah wajib diisi untuk peran Kepala Sekolah.'; render(); return; }
    const {data:foundSchool} = await sb.from('schools').select('*').eq('npsn', npsn).maybeSingle();
    if(!foundSchool){ APP.modal.error = 'NPSN tidak ditemukan. Periksa kembali NPSN sekolah yang dituju.'; render(); return; }
    ksSchool = foundSchool;
  }
  const temp = makeTempClient();
  const {data, error} = await temp.auth.signUp({email: toEmail(username), password, options:{data:{name, role: (role==='admin' ? 'operator' : role)}}});
  if(error){
    APP.modal.error = error.message.includes('already') ? 'Username sudah digunakan.' : 'Gagal membuat akun: '+error.message;
    render(); return;
  }
  await sb.from('profiles').update({role, status:'approved', ...(ksSchool ? {school_id: ksSchool.id} : {})}).eq('id', data.user.id);
  await loadAllUsersForAdmin();
  APP.modal = null;
  render();
}

function adminSchoolsPage(){
  const pengawasList = APP.allUsers.filter(u=>u.role==='pengawas' && u.status==='approved');
  const q = (APP.schoolSearchQuery||'').trim().toLowerCase();
  const schoolsToShow = !q ? APP.allSchools : APP.allSchools.filter(s=>{
    const pengawas = pengawasList.find(p=>p.id===s.pengawas_id);
    const haystack = [s.name, s.npsn, pengawas?pengawas.name:''].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  });
  return `
  <div class="card">
    <h3>Daftar Sekolah &amp; Penugasan Pengawas</h3>
    <p class="small-muted">Tentukan Pengawas pembina untuk setiap sekolah. Pengawas hanya dapat melihat sekolah yang ditugaskan kepadanya (ditegakkan oleh basis data, bukan hanya tampilan).</p>
    <div class="field" style="max-width:360px; margin-bottom:14px;">
      <label>Cari Pengawas / Sekolah / NPSN</label>
      <input type="text" placeholder="Ketik nama pengawas untuk melihat sekolah binaannya..." value="${esc(APP.schoolSearchQuery||'')}" oninput="adminFilterSchools(this.value)">
    </div>
    ${APP.allSchools.length===0 ? '<div class="empty">Belum ada sekolah terdaftar.</div>' : (schoolsToShow.length===0 ? '<div class="empty">Tidak ada sekolah yang cocok dengan pencarian.</div>' : `
    <div class="table-scroll"><table><thead><tr><th>Jenjang</th><th>Nama Sekolah</th><th>NPSN</th><th>Operator</th><th>Kepala Sekolah</th><th>Pengawas Pembina</th><th>Aksi</th></tr></thead>
    <tbody>${schoolsToShow.map(s=>{
      const op = APP.allUsers.find(u=>u.id===s.operator_id);
      const ks = APP.allUsers.find(u=>u.role==='kepala_sekolah' && u.school_id===s.id);
      // Kandidat: KS yang sudah tertaut ke sekolah ini, ditambah semua akun kepala_sekolah yang
      // belum tertaut ke sekolah manapun (school_id kosong) — termasuk akun yang "nyangkut" akibat
      // bug pendaftaran mandiri sebelumnya (school_id gagal terisi karena sesi belum aktif).
      const ksCandidates = APP.allUsers.filter(u=>u.role==='kepala_sekolah' && (u.school_id===s.id || !u.school_id));
      return `<tr><td>${s.jenjang}</td><td>${esc(s.name)}</td><td>${esc(s.npsn||'-')}</td><td>${op?esc(op.name):'-'}</td>
      <td><select onchange="adminAssignKepsek('${s.id}', this.value)">
        <option value="">— Belum ditentukan —</option>
        ${ksCandidates.map(u=>`<option value="${u.id}" ${ks && ks.id===u.id ? 'selected':''}>${esc(u.name)}</option>`).join('')}
      </select></td>
      <td><select onchange="adminAssignPengawas('${s.id}', this.value)">
        <option value="">— Belum ditentukan —</option>
        ${pengawasList.map(p=>`<option value="${p.id}" ${s.pengawas_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select></td>
      <td><button class="btn btn-danger btn-sm" onclick="adminDeleteSchool('${s.id}','${esc(s.name).replace(/'/g,"\\'")}')">Hapus Sekolah</button></td></tr>`;
    }).join('')}</tbody></table></div>`)}
  </div>`;
}
function adminFilterSchools(v){
  APP.schoolSearchQuery = v;
  render();
  const inp = document.querySelector('#app input[oninput^="adminFilterSchools"]');
  if(inp){ inp.focus(); const len=inp.value.length; inp.setSelectionRange(len,len); }

async function adminDeleteSchool(schoolId, schoolName){
  if(!confirm('Menghapus sekolah "'+schoolName+'" akan menghapus SELURUH data PTK dan riwayatnya secara permanen. Lanjutkan?')) return;

async function adminAssignPengawas(schoolId, pengawasId){

  await loadAllSchools();
  render();
}
async function adminAssignKepsek(schoolId, userId){
  // Lepas dulu Kepala Sekolah lama di sekolah ini (kalau ada) supaya tidak ada dua akun
  // kepala_sekolah tertaut ke sekolah yang sama.
  await sb.from('profiles').update({school_id:null}).eq('role','kepala_sekolah').eq('school_id', schoolId);
  if(userId){
    await sb.from('profiles').update({school_id: schoolId}).eq('id', userId);
  }
  await loadAllUsersForAdmin();
  await loadAllSchools();
  render();
}

async function moveStudentItem(kind, j, idx, dir){
  const arr = studentListRef(kind, j);
  const ni = idx+dir;
  if(ni<0||ni>=arr.length) return;
  await sb.from(studentTable(kind)).update({sort_order: ni}).eq('id', arr[idx]._id);
  await sb.from(studentTable(kind)).update({sort_order: idx}).eq('id', arr[ni]._id);
  [arr[idx],arr[ni]] = [arr[ni],arr[idx]];
  render();
}
async function deleteStudentItem(kind, j, idx){
  const arr = studentListRef(kind, j);
  const item = arr[idx];
  if(!confirm('Hapus "'+item.label+'"? Data rekap yang sudah tersimpan untuk kolom ini tetap ada di database, tapi tidak lagi tampil di matriks.')) return;
  await sb.from(studentTable(kind)).delete().eq('id', item._id);
  arr.splice(idx,1);
  render();
}

async function saveStudentItemModal(){
  const {kind, idx, jenjang} = APP.modal;
  const label = document.getElementById('si-label').value.trim();
  if(!label) return;
  const table = studentTable(kind);
  if(idx===null){
    const applyAll = document.getElementById('si-all-jenjang') && document.getElementById('si-all-jenjang').checked;
    const key = 'custom_'+uid();
    const targets = applyAll ? JENJANGS : [jenjang];
    for(const tj of targets){
      const arr = studentListRef(kind, tj);
      const sort_order = arr.length;
      const {data} = await sb.from(table).insert({jenjang:tj, key, label, sort_order}).select().single();
      arr.push({_id:data.id, key, label});
    }
  } else {
    const arr = studentListRef(kind, jenjang);
    const item = arr[idx];
    await sb.from(table).update({label}).eq('id', item._id);
    arr[idx] = {_id:item._id, key:item.key, label};
  }
  APP.modal = null;
  render();
}

async function moveField(j, idx, dir){
  const arr = APP.instruments[j];
  const ni = idx+dir;

  const a = arr[idx], b = arr[ni];
  await sb.from('instrument_fields').update({sort_order: ni}).eq('id', a._id);
  await sb.from('instrument_fields').update({sort_order: idx}).eq('id', b._id);
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
  render();
}

}

async function saveFieldModal(){
  const label = document.getElementById('fm-label').value.trim();
  const type = document.getElementById('fm-type').value;
  const optionsRaw = document.getElementById('fm-options') ? document.getElementById('fm-options').value : '';
  if(!label) return;
  const j = APP.modal.jenjang;
  let options = type==='select' ? optionsRaw.split(',').map(s=>s.trim()).filter(Boolean) : null;
  if(type==='tenure'){
    const refKey = document.getElementById('fm-tenure-ref').value;
    if(!refKey){ alert('Buat dulu minimal satu kolom bertipe Tanggal (mis. Tanggal Pengangkatan/TMT) sebelum membuat kolom Masa Kerja Otomatis.'); return; }
    options = [refKey];
  }
  if(type==='number'){
    const resetMonthly = document.getElementById('fm-reset-monthly') && document.getElementById('fm-reset-monthly').checked;
    options = resetMonthly ? ['reset_monthly'] : null;
  }
  if(APP.modal.idx===null){
    const applyAll = document.getElementById('fm-all-jenjang') && document.getElementById('fm-all-jenjang').checked;
    const key = 'custom_'+uid();
    const targets = applyAll ? JENJANGS : [j];
    for(const tj of targets){
      const sort_order = APP.instruments[tj].length;
      const {data, error} = await sb.from('instrument_fields').insert({jenjang:tj, key, label, type, options, sort_order}).select().single();
      if(error){ alert('Gagal menyimpan kolom instrumen: '+error.message); return; }
      APP.instruments[tj].push({_id:data.id, key, label, type, options});
    }
  } else {
    const f = APP.instruments[j][APP.modal.idx];
    const {data, error} = await sb.from('instrument_fields').update({label, type, options}).eq('id', f._id).select();
    if(error){ alert('Gagal menyimpan kolom instrumen: '+error.message); return; }
    if(!data || data.length===0){ alert('Tidak ada baris yang berubah. Kemungkinan ada pembatasan akses (RLS) pada tabel instrument_fields.'); return; }
    APP.instruments[j][APP.modal.idx] = {_id:f._id, key:f.key, label, type, options};
  }
  APP.modal=null;
  render();
}

async function loadAdminData(){
  const jenjang = APP.adminDataJenjang;
  const month = APP.adminDataMonth;
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const out = {};
  schools.forEach(s=>{ out[s.id] = {school:s, status:{status:'draft'}, rows:[]}; });
  if(ids.length>0){
    const {data:statuses} = await sb.from('submission_status').select('*').eq('period', month).in('school_id', ids);
    (statuses||[]).forEach(st=>{ out[st.school_id].status = st; });
    const {data:rows} = await sb.from('ptk_records').select('*').eq('period', month).in('school_id', ids).order('created_at');
    (rows||[]).forEach(r=>{ out[r.school_id].rows.push({id:r.id, ...r.data}); });
    Object.values(out).forEach(o=>{ o.rows = sortRowsByOrder(o.rows); });
  }
  APP.adminDataRows = out;
}
async function loadAdminStudentData(){
  const jenjang = APP.adminDataJenjang;
  const month = APP.adminDataMonth;
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const out = {};
  schools.forEach(s=>{ out[s.id] = {school:s, status:{status:'draft'}, counts:{}, rombel:{}}; });
  if(ids.length>0){
    const {data:statuses} = await sb.from('student_submission_status').select('*').eq('period', month).in('school_id', ids);
    (statuses||[]).forEach(st=>{ out[st.school_id].status = st; });
    const {data:counts} = await sb.from('student_counts').select('*').eq('period', month).in('school_id', ids);
    (counts||[]).forEach(c=>{ out[c.school_id].counts[c.class_key+'|'+c.religion_key] = {male:c.male, female:c.female}; });
    const {data:rombel} = await sb.from('student_rombel').select('*').eq('period', month).in('school_id', ids);
    (rombel||[]).forEach(r=>{ out[r.school_id].rombel[r.class_key] = r.rombel; });
  }
  APP.adminStuDataRows = out;
}

async function downloadStudentExcelForSchool(schoolId){
  const s = APP.allSchools.find(x=>x.id===schoolId);

  const d = APP.adminStuDataRows[schoolId];
  const classes = APP.studentClasses[s.jenjang]||[];
  const religions = APP.studentReligions[s.jenjang]||[];
  const counts = d ? d.counts : {};
  const rombel = d ? d.rombel : {};
  const wb = buildStudentWorkbook(classes, religions, counts, rombel, s.name);
  XLSX.writeFile(wb, 'Siswa-'+sanitizeFileName(s.name)+'-'+APP.adminDataMonth+'.xlsx');

function studentMatrixHtml(classes, religions, counts, rombel, editable){
  if(classes.length===0 || religions.length===0) return '<div class="empty">Instrumen siswa untuk jenjang ini belum diatur oleh Admin.</div>';
  const header1 = `<tr><th rowspan="2" style="vertical-align:bottom;">Agama</th>${classes.map(c=>`<th colspan="2" style="text-align:center;">${esc(c.label)}</th>`).join('')}<th colspan="2" style="text-align:center;">Total</th></tr>`;
  const header2 = `<tr>${classes.map(()=>`<th>L</th><th>P</th>`).join('')}<th>L</th><th>P</th></tr>`;
  let grandM=0, grandF=0;
  const bodyRows = religions.map(r=>{
    let totalM=0, totalF=0;
    const cells = classes.map(c=>{
      const cell = counts[c.key+'|'+r.key] || {male:0,female:0};
      totalM += cell.male||0; totalF += cell.female||0;
      if(editable) return `<td><input type="number" min="0" class="stu-input" id="stu-m-${c.key}-${r.key}" value="${cell.male||0}" style="width:56px;"></td><td><input type="number" min="0" class="stu-input" id="stu-f-${c.key}-${r.key}" value="${cell.female||0}" style="width:56px;"></td>`;
      return `<td>${cell.male||0}</td><td>${cell.female||0}</td>`;
    }).join('');
    grandM += totalM; grandF += totalF;
    return `<tr><td>${esc(r.label)}</td>${cells}<td><strong>${totalM}</strong></td><td><strong>${totalF}</strong></td></tr>`;
  }).join('');
  const rombelCells = classes.map(c=>{
    const val = rombel[c.key]||0;
    if(editable) return `<td colspan="2"><input type="number" min="0" class="stu-input" id="stu-rombel-${c.key}" value="${val}" style="width:56px;"></td>`;
    return `<td colspan="2">${val}</td>`;
  }).join('');
  const footerRow = `<tr><td><strong>Jumlah Rombel</strong></td>${rombelCells}<td colspan="2"></td></tr>`;
  const totalRow = `<tr><td><strong>Total Keseluruhan</strong></td><td colspan="${classes.length*2}"></td><td><strong>${grandM}</strong></td><td><strong>${grandF}</strong></td></tr>`;
  return `<div class="table-scroll"><table>${header1}${header2}<tbody>${bodyRows}${footerRow}${totalRow}</tbody></table></div>`;
}
function readStudentMatrixFromDom(classes, religions){
  const counts = {}, rombel = {};
  religions.forEach(r=>{
    classes.forEach(c=>{
      const mEl = document.getElementById('stu-m-'+c.key+'-'+r.key);
      const fEl = document.getElementById('stu-f-'+c.key+'-'+r.key);
      counts[c.key+'|'+r.key] = { male: mEl ? (parseInt(mEl.value,10)||0) : 0, female: fEl ? (parseInt(fEl.value,10)||0) : 0 };
    });
  });
  classes.forEach(c=>{
    const rEl = document.getElementById('stu-rombel-'+c.key);
    rombel[c.key] = rEl ? (parseInt(rEl.value,10)||0) : 0;
  });
  return {counts, rombel};
}
function studentTotalStudents(counts){
  return Object.values(counts).reduce((sum,c)=>sum+(c.male||0)+(c.female||0), 0);
}
function buildStudentWorkbook(classes, religions, counts, rombel, schoolName){
  const header = ['Agama'];
  classes.forEach(c=>{ header.push(c.label+' (L)', c.label+' (P)'); });
  const aoa = [['Sekolah: '+schoolName], header];
  religions.forEach(r=>{
    const row = [r.label];
    classes.forEach(c=>{ const cell = counts[c.key+'|'+r.key]||{male:0,female:0}; row.push(cell.male||0, cell.female||0); });
    aoa.push(row);
  });
  const rombelRow = ['Jumlah Rombel'];
  classes.forEach(c=>{ rombelRow.push(rombel[c.key]||0, ''); });
  aoa.push(rombelRow);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data Siswa');
  return wb;
}

async function adminExportStudentZip(){
  const statusEl = document.getElementById('export-status');
  if(statusEl) statusEl.textContent = 'Menyiapkan berkas…';
  const month = APP.exportMonth;
  const jenjang = APP.exportJenjang;
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const zip = new JSZip();
  let count = 0;
  if(ids.length>0){
    let allowedIds = null;
    if(APP.exportOnlySubmitted){
      const {data:statuses} = await sb.from('student_submission_status').select('school_id,status').eq('period', month).in('school_id', ids);
      allowedIds = new Set((statuses||[]).filter(st=> st.status==='diajukan' || st.status==='terverifikasi').map(st=>st.school_id));
    }
    const {data:allCounts} = await sb.from('student_counts').select('*').eq('period', month).in('school_id', ids);
    const {data:allRombel} = await sb.from('student_rombel').select('*').eq('period', month).in('school_id', ids);
    const countsBySchool = {}, rombelBySchool = {};
    (allCounts||[]).forEach(c=>{ (countsBySchool[c.school_id]=countsBySchool[c.school_id]||{})[c.class_key+'|'+c.religion_key]={male:c.male,female:c.female}; });
    (allRombel||[]).forEach(r=>{ (rombelBySchool[r.school_id]=rombelBySchool[r.school_id]||{})[r.class_key]=r.rombel; });
    for(const s of schools){
      if(allowedIds && !allowedIds.has(s.id)) continue;
      const counts = countsBySchool[s.id];
      if(!counts) continue;
      const classes = APP.studentClasses[s.jenjang]||[];
      const religions = APP.studentReligions[s.jenjang]||[];
      const wb = buildStudentWorkbook(classes, religions, counts, rombelBySchool[s.id]||{}, s.name);
      const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
      zip.folder(s.jenjang).file('Siswa-'+sanitizeFileName(s.name)+'.xlsx', buf);
      count++;
    }
  }
  if(count===0){ if(statusEl) statusEl.textContent='Tidak ada data siswa untuk bulan/jenjang tersebut.'; return; }
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob(blob, 'Data-Siswa-'+jenjang+'-'+month+'.zip');
  if(statusEl) statusEl.textContent = 'Berhasil mengunduh ZIP berisi '+count+' sekolah.';
}
async function adminExportZip(){
  const statusEl = document.getElementById('export-status');
  if(statusEl) statusEl.textContent = 'Menyiapkan berkas…';
  const month = APP.exportMonth;
  const jenjang = APP.exportJenjang;
  const selectedKeys = Object.keys(APP.exportSelectedKeys||{}).filter(k=>APP.exportSelectedKeys[k]);
  const schools = APP.allSchools.filter(s=> jenjang==='ALL' || s.jenjang===jenjang);
  const ids = schools.map(s=>s.id);
  const zip = new JSZip();
  let count = 0;
  if(ids.length>0){
    let allowedIds = null;
    if(APP.exportOnlySubmitted){
      const {data:statuses} = await sb.from('submission_status').select('school_id,status').eq('period', month).in('school_id', ids);
      allowedIds = new Set((statuses||[]).filter(st=> st.status==='diajukan' || st.status==='terverifikasi').map(st=>st.school_id));
    }
    const {data:allRows} = await sb.from('ptk_records').select('*').eq('period', month).in('school_id', ids).order('created_at');
    const bySchool = {};
    (allRows||[]).forEach(r=>{ (bySchool[r.school_id] = bySchool[r.school_id]||[]).push({id:r.id, ...r.data}); });
    Object.keys(bySchool).forEach(k=>{ bySchool[k] = sortRowsByOrder(bySchool[k]); });
    for(const s of schools){
      if(allowedIds && !allowedIds.has(s.id)) continue;
      const rows = bySchool[s.id];
      if(!rows || rows.length===0) continue;
      const fields = APP.instruments[s.jenjang].filter(f=> selectedKeys.includes(f.key));
      if(fields.length===0) continue;
      const wb = buildWorkbook(fields, rows, s.name, month);
      const buf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
      zip.folder(s.jenjang).file(sanitizeFileName(s.name)+'.xlsx', buf);
      count++;
    }
  }
  if(count===0){ if(statusEl) statusEl.textContent='Tidak ada data untuk bulan/jenjang/kolom yang dipilih.'; return; }
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob(blob, 'Data-PTK-'+jenjang+'-'+month+'.zip');
  if(statusEl) statusEl.textContent = 'Berhasil mengunduh ZIP berisi '+count+' sekolah.';
}
function sanitizeFileName(s){ return s.replace(/[^a-z0-9\-_. ]/gi,'_'); }
function buildWorkbook(fields, rows, schoolName, period){
  const data = rows.map((r,i)=>{
    const o = {'No':i+1, 'Nama Sekolah':schoolName};
    fields.forEach(f=>{
      if(f.type==='photo') o[f.label] = r[f.key] ? 'Terlampir' : '-';
      else if(f.type==='tenure'){ const refKey=(f.options||[])[0]; o[f.label] = computeMasaKerja(r[refKey], period) || ''; }
      else o[f.label] = r[f.key] || '';
    });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data PTK');
  return wb;
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
async function downloadExcelForSchoolMonth(schoolId){
  const s = APP.allSchools.find(x=>x.id===schoolId);
  if(!s) return;
  const month = APP.adminDataMonth || APP.pgMonth || APP.dinasMonth || currentMonthStr();
  const {data:rows} = await sb.from('ptk_records').select('*').eq('school_id', schoolId).eq('period', month).order('created_at');
  if(!rows || rows.length===0) return;
  const flat = sortRowsByOrder(rows.map(r=>({id:r.id, ...r.data})));
  const fields = APP.instruments[s.jenjang];
  const wb = buildWorkbook(fields, flat, s.name, month);
  XLSX.writeFile(wb, sanitizeFileName(s.name)+'-'+month+'.xlsx');
}

function mySchool(){ return APP.mySchoolObj; }

// Mengurutkan baris PTK berdasarkan field _order (urutan manual yang diatur Operator).
// Baris yang belum punya _order (data lama) diberi urutan sesuai posisi kemunculannya (created_at).
function sortRowsByOrder(rows){
  rows.forEach((r,i)=>{ if(r._order===undefined || r._order===null || isNaN(Number(r._order))) r._order = i; });
  rows.sort((a,b)=> Number(a._order) - Number(b._order));
  return rows;
}
async function loadOperatorMonth(month){
  APP.opMonth = month;
  const school = mySchool();
  if(!school) return;
  const {data:status} = await sb.from('submission_status').select('*').eq('school_id', school.id).eq('period', month).maybeSingle();
  const {data:rows} = await sb.from('ptk_records').select('*').eq('school_id', school.id).eq('period', month).order('created_at');
  APP.opStatus = status || {status:'draft'};
  const mapped = (rows||[]).map(r=>({id:r.id, ...r.data}));
  APP.opRows = sortRowsByOrder(mapped);
  APP.opCarryForward = null;
  if(APP.opRows.length===0){
    APP.opCarryForward = await findPreviousMonthData(school.id, month);
  }
}

async function findPreviousMonthData(schoolId, fromMonth){
  let [y,m] = fromMonth.split('-').map(Number);
  for(let i=0;i<12;i++){
    m -= 1;
    if(m===0){ m=12; y-=1; }
    const period = y+'-'+String(m).padStart(2,'0');
    const {data:rows} = await sb.from('ptk_records').select('*').eq('school_id', schoolId).eq('period', period).order('created_at');
    if(rows && rows.length>0){ return {period, rows: rows.map(r=>r.data)}; }
  }
  return null;
}

async function operatorApplyCarryForward(){
  if(!APP.opCarryForward) return;
  const school = mySchool();
  const tenureFields = APP.instruments[school.jenjang].filter(f=>f.type==='tenure');
  const resetFields = APP.instruments[school.jenjang].filter(isResetMonthlyField);
  const newRows = APP.opCarryForward.rows.map(d=>{
    const data = {...d};
    if(!data._link_id) data._link_id = uid();
    tenureFields.forEach(f=>{ const refKey=(f.options||[])[0]; data[f.key] = computeMasaKerja(data[refKey], APP.opMonth) || ''; });
    resetFields.forEach(f=>{ data[f.key] = ''; });
    return {school_id: school.id, period: APP.opMonth, data};
  });
  const {data} = await sb.from('ptk_records').insert(newRows).select();
  (data||[]).forEach(r=>{ APP.opRows.push({id:r.id, ...r.data}); });
  await sb.from('submission_status').upsert({school_id: school.id, period: APP.opMonth, status:'draft'}, {onConflict:'school_id,period'});
  APP.opStatus = {status:'draft'};
  APP.opCarryForward = null;
  render();
}

/* ---------------------------- Unduh Template & Impor Excel ---------------------------- */
function operatorDownloadTemplate(){
  const school = mySchool();
  const fields = APP.instruments[school.jenjang].filter(f=>f.type!=='photo' && f.type!=='tenure');
  const headerRow = ['No', ...fields.map(f=>f.label)];
  const ws = XLSX.utils.aoa_to_sheet([headerRow]);
  // Paksa kolom bertipe "Tanggal" menjadi format Teks ('@') di Excel.
  // Ini penting: tanpa format ini, saat pengguna mengetik tanggal langsung di Excel
  // (mis. 11-11-2026), Excel akan otomatis mengubahnya menjadi nilai tanggal ASLI —
  // dan cara Excel menafsirkan urutan hari/bulan tsb mengikuti pengaturan regional
  // Excel di komputer masing-masing pengguna (bisa DD-MM-YYYY atau MM-DD-YYYY).
  // Kalau berbeda dari asumsi kita, tanggal jadi salah SEBELUM sempat diimpor.
  // Dengan format Teks, apa pun yang diketik pengguna disimpan apa adanya sebagai
  // teks, lalu parseFlexibleDate() kita sendiri yang menafsirkannya secara konsisten
  // (format Indonesia: DD-MM-YYYY), sehingga hasilnya sama di semua komputer.
  const dateColIdx = [];
  fields.forEach((f,i)=>{ if(f.type==='date') dateColIdx.push(i+1); }); // +1 karena kolom "No" di index 0
  if(dateColIdx.length){
    const TEXT_TEMPLATE_ROWS = 500; // cukup untuk data yang akan diisi pengguna
    dateColIdx.forEach(colIdx=>{
      for(let r=1; r<=TEXT_TEMPLATE_ROWS; r++){ // mulai dari baris ke-2 (index 1), baris 1 = header
        const addr = XLSX.utils.encode_cell({r, c:colIdx});
        ws[addr] = {t:'s', v:'', z:'@'};
      }
    });
    const endAddr = XLSX.utils.encode_cell({r:TEXT_TEMPLATE_ROWS, c:headerRow.length-1});
    ws['!ref'] = 'A1:'+endAddr;
    // Tambahkan catatan format di baris paling bawah supaya pengguna tahu cara mengisi tanggal
    const noteRow = TEXT_TEMPLATE_ROWS + 2;
    const noteAddr = XLSX.utils.encode_cell({r:noteRow, c:0});
    ws[noteAddr] = {t:'s', v:'Catatan: isi kolom Tanggal dengan format DD-MM-YYYY, contoh 11-11-2026 (jangan diubah menjadi format tanggal Excel).'};
    ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:noteRow, c:headerRow.length-1}});
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'Template-Data-PTK-'+school.jenjang+'.xlsx');
}
function operatorImportExcel(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const school = mySchool();
  const fields = APP.instruments[school.jenjang];
  // Normalisasi label (trim + lowercase) supaya pencocokan kolom tidak gagal hanya karena beda spasi/huruf besar-kecil
  const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const labelToKey = {};
  fields.forEach(f=>{ labelToKey[norm(f.label)] = f.key; });
  const reader = new FileReader();
  reader.onload = async function(e){
    let wb;
    try{
      wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
    }catch(err){ alert('Gagal membaca berkas. Pastikan formatnya .xlsx atau .xls yang valid.'); evt.target.value=''; return; }
    if(!wb.SheetNames || wb.SheetNames.length===0){ alert('Berkas tidak berisi sheet apapun.'); evt.target.value=''; return; }
    // Cari sheet yang benar-benar berisi kolom sesuai template (jaga-jaga bila berkas punya lebih dari satu sheet,
    // atau sheet pertama kosong/berisi catatan lain). Sheet dipilih berdasarkan jumlah kolom header yang cocok terbanyak.
    let bestJson = [], bestMatchCount = -1, bestHeaders = [];
    wb.SheetNames.forEach(name=>{
      const ws = wb.Sheets[name];
      const j = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(j.length===0) return;
      const headers = Object.keys(j[0]);
      const matchCount = headers.filter(h=>labelToKey[norm(h)]).length;
      if(matchCount > bestMatchCount){ bestMatchCount = matchCount; bestJson = j; bestHeaders = headers; }
    });
    if(bestMatchCount<=0){
      alert(bestJson.length===0
        ? 'Berkas kosong (tidak ada baris data). Pastikan Anda mengisi data mulai baris ke-2 pada Template Excel yang sudah diunduh, lalu simpan berkasnya.'
        : 'Kolom pada berkas tidak cocok dengan Template. Pastikan judul kolom pada baris pertama sama persis dengan Template Excel yang diunduh dari aplikasi ini (kolom ditemukan: '+bestHeaders.join(', ')+').');
      evt.target.value='';
      return;
    }
    const json = bestJson;
    const rawRows = json.map((row, idx)=>{
      const obj = {};
      fields.forEach(f=>{ obj[f.key] = ''; });
      Object.keys(row).forEach(colLabel=>{
        const key = labelToKey[norm(colLabel)];
        if(!key) return;
        const fieldDef = fields.find(f=>f.key===key);
        if(fieldDef && fieldDef.type==='date'){
          obj[key] = parseFlexibleDate(row[colLabel]);
        } else {
          obj[key] = String(row[colLabel]);
        }
      });
      return obj;
    });
    // Buang baris yang sebenarnya kosong (semua kolom tidak terisi). Ini sering terjadi karena
    // Excel mencatat "used range" lebih panjang dari data sesungguhnya (sisa format/klik lama),
    // sehingga sheet_to_json ikut membaca ratusan baris kosong yang tidak seharusnya diimpor.
    const filledRows = rawRows.filter(obj => fields.some(f => f.type!=='tenure' && String(obj[f.key]||'').trim()!==''));
    const skippedCount = rawRows.length - filledRows.length;
    if(filledRows.length===0){
      alert('Semua baris pada berkas ini kosong. Tidak ada data yang diimpor.');
      evt.target.value='';
      return;
    }
    const newRows = filledRows.map((obj, idx)=>{
      fields.filter(f=>f.type==='tenure').forEach(f=>{
        const refKey = (f.options||[])[0];
        obj[f.key] = computeMasaKerja(obj[refKey], APP.opMonth) || '';
      });
      obj._link_id = uid();
      obj._order = APP.opRows.length + idx;
      return {school_id: school.id, period: APP.opMonth, data: obj};
    });
    const {data, error} = await sb.from('ptk_records').insert(newRows).select();
    if(error){ alert('Gagal impor: '+error.message); return; }
    if(skippedCount>0){ alert(`Impor berhasil. ${skippedCount} baris kosong pada berkas Excel dilewati dan tidak diimpor.`); }
    (data||[]).forEach(r=>{ APP.opRows.push({id:r.id, ...r.data}); });
    if(!APP.opStatus || !APP.opStatus.status){ APP.opStatus = {status:'draft'}; }
    await sb.from('submission_status').upsert({school_id: school.id, period: APP.opMonth, status:'draft'}, {onConflict:'school_id,period'});
    APP.opCarryForward = null;
    evt.target.value = '';
    render();
  };
  reader.readAsArrayBuffer(file);
}

function isNameField(f){ return /nama/i.test(f.label||''); }

async function operatorMoveRow(rowId, dir){
  const idx = APP.opRows.findIndex(r=>r.id===rowId);
  if(idx<0) return;
  const target = dir==='up' ? idx-1 : idx+1;
  if(target<0 || target>=APP.opRows.length) return;
  const a = APP.opRows[idx], b = APP.opRows[target];
  const orderA = Number(a._order), orderB = Number(b._order);
  a._order = orderB; b._order = orderA;
  APP.opRows[idx] = b; APP.opRows[target] = a;
  render();
  const stripA = {...a}; delete stripA.id;
  const stripB = {...b}; delete stripB.id;
  await Promise.all([
    sb.from('ptk_records').update({data: stripA}).eq('id', a.id),
    sb.from('ptk_records').update({data: stripB}).eq('id', b.id)
  ]);
}

function startEditPtkRow(rowId){ APP.editingPtkRowId = rowId; render(); }
function cancelEditPtkRow(){ APP.editingPtkRowId = null; render(); }

function renderInlinePtkField(f, r){
  const val = r[f.key] || '';
  if(f.type==='tenure'){
    const refKey = (f.options||[])[0];
    const computed = computeMasaKerja(r[refKey], APP.opMonth) || '-';
    return `<input id="pf-${f.key}" type="text" value="${esc(computed)}" readonly disabled style="width:130px; background:#F0EEE7;">`;
  }
  if(f.type==='select'){
    return `<select id="pf-${f.key}" style="min-width:110px;"><option value="">— pilih —</option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="pf-${f.key}" style="min-width:150px; min-height:36px;">${esc(val)}</textarea>`;
  }
  if(f.type==='photo'){
    const previewHtml = val ? (isPdfDataUrl(val) ? `<a href="${val}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" id="pf-preview-${f.key}">📄 PDF</a>` : `<img class="photo-thumb" src="${val}" id="pf-preview-${f.key}">`) : `<div class="photo-thumb" id="pf-preview-${f.key}"></div>`;
    return `<div class="photo-input-wrap">${previewHtml}<input type="file" accept="image/*,.pdf,application/pdf" onchange="handlePhotoUploadInline(event,'${f.key}')" style="width:130px;"></div><input type="hidden" id="pf-${f.key}" value="${val}">`;
  }
  const changeAttr = f.type==='date' ? ` onchange="recomputeTenureFieldsInline('${f.key}')"` : '';
  const isNumeric = f.type==='number' || f.type==='currency';
  const style = isNumeric ? 'width:64px;' : 'min-width:120px;';
  const fieldVal = f.type==='date' ? parseFlexibleDate(val) : val;
  return `<input id="pf-${f.key}" type="${isNumeric?'number':f.type==='date'?'date':'text'}" value="${esc(fieldVal)}" style="${style}"${changeAttr}>`;
}
function recomputeTenureFieldsInline(changedDateKey){
  const school = mySchool();
  const fields = APP.instruments[school.jenjang];
  fields.filter(f=>f.type==='tenure' && (f.options||[])[0]===changedDateKey).forEach(f=>{
    const dateEl = document.getElementById('pf-'+changedDateKey);
    const out = document.getElementById('pf-'+f.key);
    if(dateEl && out) out.value = computeMasaKerja(dateEl.value, APP.opMonth) || '-';
  });
}
function handlePhotoUploadInline(evt, key){
  const file = evt.target.files[0];
  if(!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if(isPdf){
    if(file.size > 4*1024*1024){ alert('Berkas PDF terlalu besar (maks. sekitar 4MB).'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result;
      document.getElementById('pf-'+key).value = dataUrl;
      const prev = document.getElementById('pf-preview-'+key);
      prev.outerHTML = `<a href="${dataUrl}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" id="pf-preview-${key}">📄 Lihat PDF</a>`;
    };
    reader.readAsDataURL(file);
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const targetW = 90, targetH = 115;
      canvas.width = targetW; canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(targetW/img.width, targetH/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (targetW-w)/2, (targetH-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('pf-'+key).value = dataUrl;
      const prev = document.getElementById('pf-preview-'+key);
      prev.outerHTML = `<img class="photo-thumb" src="${dataUrl}" id="pf-preview-${key}">`;
    };
    img.src = e.target.result;
  };

}
async function savePtkRowInline(rowId){

  fieldsObj._link_id = existing._link_id || uid();

  const idx = APP.opRows.findIndex(r=>r.id===rowId);
  if(idx>=0) APP.opRows[idx] = {id:rowId, ...fieldsObj};

// Menyalin perubahan data PTK (kecuali kolom tipe Angka yang ditandai "kosongkan tiap bulan" seperti S/I/A,
// dan kolom Masa Kerja Otomatis yang selalu dihitung ulang) ke bulan-bulan berikutnya yang sudah pernah
// dibuat lewat "Lanjutkan Data Bulan Itu ke Bulan Ini", sampai ada perubahan baru lagi di bulan tersebut/berikutnya.
async function propagatePtkEditForward(schoolId, fieldsObj, fields){
  const linkId = fieldsObj._link_id;
  if(!linkId) return;
  const skipKeys = new Set(['_link_id']);
  fields.forEach(f=>{ if(f.type==='tenure' || isResetMonthlyField(f)) skipKeys.add(f.key); });
  const carryData = {};
  Object.keys(fieldsObj).forEach(k=>{ if(!skipKeys.has(k)) carryData[k] = fieldsObj[k]; });
  const {data: futureRows} = await sb.from('ptk_records').select('id,period,data').eq('school_id', schoolId).gt('period', APP.opMonth).contains('data', {_link_id: linkId});
  if(!futureRows || futureRows.length===0) return;
  for(const row of futureRows){
    const merged = {...row.data, ...carryData};
    await sb.from('ptk_records').update({data: merged, updated_at: nowIso()}).eq('id', row.id);
  }
}

async function loadOperatorStudentMonth(month){
  const school = mySchool();
  if(!school) return;
  const {data:status} = await sb.from('student_submission_status').select('*').eq('school_id', school.id).eq('period', month).maybeSingle();
  const {data:counts} = await sb.from('student_counts').select('*').eq('school_id', school.id).eq('period', month);
  const {data:rombel} = await sb.from('student_rombel').select('*').eq('school_id', school.id).eq('period', month);
  APP.opStuStatus = status || {status:'draft'};
  APP.opStuCounts = {};
  (counts||[]).forEach(c=>{ APP.opStuCounts[c.class_key+'|'+c.religion_key] = {male:c.male, female:c.female}; });
  APP.opStuRombel = {};
  (rombel||[]).forEach(r=>{ APP.opStuRombel[r.class_key] = r.rombel; });
  APP.opStuCarryForward = null;
  if((counts||[]).length===0 && (rombel||[]).length===0){
    APP.opStuCarryForward = await findPreviousStudentMonthData(school.id, month);
  }
}
async function findPreviousStudentMonthData(schoolId, fromMonth){
  let [y,m] = fromMonth.split('-').map(Number);
  for(let i=0;i<12;i++){
    m -= 1;
    if(m===0){ m=12; y-=1; }
    const period = y+'-'+String(m).padStart(2,'0');
    const {data:counts} = await sb.from('student_counts').select('*').eq('school_id', schoolId).eq('period', period);
    const {data:rombel} = await sb.from('student_rombel').select('*').eq('school_id', schoolId).eq('period', period);
    if((counts && counts.length>0) || (rombel && rombel.length>0)){
      return {period, counts: counts||[], rombel: rombel||[]};
    }
  }
  return null;
}
async function operatorApplyStudentCarryForward(){
  if(!APP.opStuCarryForward) return;

  const rombelRows = APP.opStuCarryForward.rombel.map(r=>({school_id: school.id, period: APP.opMonth, class_key: r.class_key, rombel: r.rombel}));

  render();
}

function renderFieldInput(f, draft){

  }
  if(f.type==='select'){
    return `<div class="field"><label>${esc(f.label)}</label><select id="rf-${f.key}"><option value="">— pilih —</option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='textarea'){
    return `<div class="field"><label>${esc(f.label)}</label><textarea id="rf-${f.key}">${esc(val)}</textarea></div>`;
  }
  if(f.type==='photo'){
    const previewHtml = val ? (isPdfDataUrl(val) ? `<a href="${val}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" id="rf-preview-${f.key}">📄 Lihat PDF</a>` : `<img class="photo-thumb" src="${val}" id="rf-preview-${f.key}">`) : `<div class="photo-thumb" id="rf-preview-${f.key}"></div>`;

        ${previewHtml}
        <input type="file" accept="image/*,.pdf,application/pdf" onchange="handlePhotoUpload(event,'${f.key}')">
      </div>
      <p class="small-muted" style="margin-top:4px;">Bisa unggah foto (JPG/PNG) atau berkas PDF.</p>
      <input type="hidden" id="rf-${f.key}" value="${val}"></div>`;
  }
  const changeAttr = f.type==='date' ? ` onchange="recomputeTenureFields('${f.key}')"` : '';
  const isNumeric = f.type==='number' || f.type==='currency';
  const fieldVal = f.type==='date' ? parseFlexibleDate(val) : val;
  return `<div class="field"><label>${esc(f.label)}</label><input id="rf-${f.key}" type="${isNumeric?'number':f.type==='date'?'date':'text'}" value="${esc(fieldVal)}"${changeAttr}></div>`;

function handlePhotoUpload(evt, key){
  const file = evt.target.files[0];
  if(!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if(isPdf){
    if(file.size > 4*1024*1024){ alert('Berkas PDF terlalu besar (maks. sekitar 4MB).'); evt.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const dataUrl = e.target.result;
      document.getElementById('rf-'+key).value = dataUrl;
      const prev = document.getElementById('rf-preview-'+key);
      prev.outerHTML = `<a href="${dataUrl}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" id="rf-preview-${key}">📄 Lihat PDF</a>`;
    };
    reader.readAsDataURL(file);
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const targetW = 90, targetH = 115;
      canvas.width = targetW; canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(targetW/img.width, targetH/img.height);
      const w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (targetW-w)/2, (targetH-h)/2, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('rf-'+key).value = dataUrl;
      const prev = document.getElementById('rf-preview-'+key);
      prev.outerHTML = `<img class="photo-thumb" src="${dataUrl}" id="rf-preview-${key}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  const {error: updErr} = await sb.from('student_submission_status').update({status:'draft', catatan:null, verified_by:null, verified_at:null, exported_to_admin:false, exported_at:null}).eq('school_id', school.id).eq('period', period);
  if(updErr){ alert('Data Siswa berhasil dihapus, namun status gagal direset: '+updErr.message); }

function cellValuePlain(f, r, period){
  if(f.type==='photo') return r[f.key] ? 'Ada lampiran' : '-';
  if(f.type==='tenure'){ const refKey=(f.options||[])[0]; return computeMasaKerja(r[refKey], period) || '-'; }
  if(f.type==='currency') return formatRupiah(r[f.key]);
  const v = r[f.key];
  return (v===undefined||v===null||v==='') ? '-' : String(v);
}

/* ------------------------ Generator PDF (dipakai Operator & Pengawas) ------------------------ */
function generatePtkPdf(school, fields, records, period, status){
  const cleanFields = fields.filter(f=>f.type!=='photo');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  doc.setFontSize(12);
  doc.text('Data PTK — '+school.name, 30, 30);
  doc.setFontSize(9);
  doc.text('Bulan: '+monthLabel(period)+'   |   Status: Terverifikasi'+(status?(' oleh '+(status.verified_by||'-')+' pada '+fmtDateTime(status.verified_at)) : ''), 30, 45);
  doc.autoTable({
    startY: 58,
    head: [['No', ...cleanFields.map(f=>f.label)]],
    body: records.map((r,i)=>[i+1, ...cleanFields.map(f=>cellValuePlain(f,r,period))]),
    styles:{fontSize:7, cellPadding:3},
    headStyles:{fillColor:[30,58,95]},
    margin:{left:20,right:20}
  });
  doc.save('PTK-'+sanitizeFileName(school.name)+'-'+period+'.pdf');
}

function generateStudentPdf(school, classes, religions, countsMap, rombelMap, period, status){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  doc.setFontSize(12);
  doc.text('Data Siswa — '+school.name, 30, 30);
  doc.setFontSize(9);
  doc.text('Bulan: '+monthLabel(period)+'   |   Status: Terverifikasi'+(status?(' oleh '+(status.verified_by||'-')+' pada '+fmtDateTime(status.verified_at)) : ''), 30, 45);
  const head = ['Agama', ...classes.flatMap(c=>[c.label+' (L)', c.label+' (P)']), 'Total (L)', 'Total (P)'];
  let grandM=0, grandF=0;
  const body = religions.map(r=>{
    let totalM=0, totalF=0;
    const cells = classes.flatMap(c=>{
      const cell = countsMap[c.key+'|'+r.key] || {male:0,female:0};
      totalM += cell.male||0; totalF += cell.female||0;
      return [cell.male||0, cell.female||0];
    });
    grandM += totalM; grandF += totalF;
    return [r.label, ...cells, totalM, totalF];
  });
  const rombelRow = ['Jumlah Rombel', ...classes.flatMap(c=>[rombelMap[c.key]||0, '']), '', ''];
  const totalRow = ['Total Keseluruhan', ...classes.flatMap(()=>['','']), grandM, grandF];
  body.push(rombelRow, totalRow);
  doc.autoTable({
    startY: 58,
    head: [head],
    body: body,
    styles:{fontSize:7, cellPadding:3},
    headStyles:{fillColor:[30,58,95]},
    margin:{left:20,right:20}
  });
  doc.save('Siswa-'+sanitizeFileName(school.name)+'-'+period+'.pdf');
}

async function operatorDownloadPtkPdf(period){
  const school = mySchool();
  if(!school) return;
  const status = APP.historyPtk ? APP.historyPtk[period] : null;
  const {data:rows} = await sb.from('ptk_records').select('*').eq('school_id', school.id).eq('period', period).order('created_at');
  const records = (rows||[]).map(r=>({id:r.id, ...r.data}));
  const fields = APP.instruments[school.jenjang]||[];
  generatePtkPdf(school, fields, records, period, status);
}

async function operatorDownloadStudentPdf(period){
  const school = mySchool();
  if(!school) return;
  const status = APP.historyStudent ? APP.historyStudent[period] : null;
  const [{data:counts}, {data:rombel}] = await Promise.all([
    sb.from('student_counts').select('*').eq('school_id', school.id).eq('period', period),
    sb.from('student_rombel').select('*').eq('school_id', school.id).eq('period', period)
  ]);
  const countsMap = {};
  (counts||[]).forEach(c=>{ countsMap[c.class_key+'|'+c.religion_key] = {male:c.male, female:c.female}; });
  const rombelMap = {};
  (rombel||[]).forEach(r=>{ rombelMap[r.class_key] = r.rombel; });
  const classes = APP.studentClasses[school.jenjang]||[];
  const religions = APP.studentReligions[school.jenjang]||[];
  generateStudentPdf(school, classes, religions, countsMap, rombelMap, period, status);
}

async function pengawasApproveCancelVerification(schoolId, period){
  schoolId = schoolId || APP.pgSchoolId;
  period = period || APP.pgMonth;
  if(!confirm('Setujui pembatalan verifikasi? Status akan kembali ke Belum Diajukan dan Operator dapat mengedit ulang data bulan ini. Data yang sudah ada tidak akan dihapus.')) return;

  if(error){ alert('Gagal menyetujui pembatalan: '+error.message); return; }
  if(!data || data.length===0){ alert('Tidak ada baris yang berubah saat menyetujui pembatalan. Periksa kebijakan RLS pada tabel submission_status untuk role pengawas.'); }
  await loadPengawasPendingCancellations();
  if(schoolId===APP.pgSchoolId && period===APP.pgMonth) await loadPengawasMonth();

}
async function pengawasRejectCancelVerification(schoolId, period){
  schoolId = schoolId || APP.pgSchoolId;

  const {data, error} = await sb.from('submission_status').update({status:'terverifikasi', catatan:null}).eq('school_id', schoolId).eq('period', period).select();

  render();
}

async function dinasSetSchool(id){
  APP.dinasSchoolId = id;
  render();
  if(id==='ALL') return;
  const school = APP.allSchools.find(s=>s.id===id);
  if(APP.dinasDataType==='siswa'){
    const {data:counts} = await sb.from('student_counts').select('*').eq('school_id', id).eq('period', APP.dinasMonth);
    const {data:rombel} = await sb.from('student_rombel').select('*').eq('school_id', id).eq('period', APP.dinasMonth);
    APP._dinasSchool = school;
    APP._dinasStuCounts = {};
    (counts||[]).forEach(c=>{ APP._dinasStuCounts[c.class_key+'|'+c.religion_key] = {male:c.male, female:c.female}; });
    APP._dinasStuRombel = {};
    (rombel||[]).forEach(r=>{ APP._dinasStuRombel[r.class_key] = r.rombel; });
    renderDinasStudentBlock();
    return;
  }
  const {data} = await sb.from('ptk_records').select('*').eq('school_id', id).eq('period', APP.dinasMonth).order('created_at');
  const rows = sortRowsByOrder((data||[]).map(r=>({id:r.id, ...r.data})));
  const fields = APP.instruments[school.jenjang];
  APP._dinasSchool = school;
  APP._dinasRows = rows;
  APP._dinasFields = fields;
  APP.dinasSelectedKeys = {};

async function dinasDownloadStudent(){

function renderDinasBlock(){
  const el = document.getElementById('dinas-table');
  if(!el) return;

  `;
}
function dinasToggleField(key){ APP.dinasSelectedKeys[key] = !APP.dinasSelectedKeys[key]; renderDinasBlock(); }
function dinasSetAllFields(val){ APP._dinasFields.forEach(f=>{ APP.dinasSelectedKeys[f.key]=val; }); renderDinasBlock(); }
async function dinasDownload(){
  const school = APP._dinasSchool, rows = APP._dinasRows;
